<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSDWAN 文章</title>
<style>
  :root {
    --text: #1f2328;
    --text-secondary: #57606a;
    --border: #e5e7eb;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --bg-soft: #f8f9fb;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #ffffff;
    color: var(--text);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 64px 24px 96px;
  }
  /* 顶部 */
  header { margin-bottom: 48px; }
  .site-badge {
    display: inline-block;
    font-size: 13px;
    letter-spacing: 1px;
    color: var(--accent);
    background: #eff6ff;
    border: 1px solid #dbeafe;
    border-radius: 999px;
    padding: 4px 14px;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 10px;
  }
  .subtitle {
    font-size: 16px;
    color: var(--text-secondary);
  }
  /* 文章目录 */
  .section-title {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-secondary);
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .article-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .article-card {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    border: 1px solid var(--border);
    border-radius: 10px;
    text-decoration: none;
    color: inherit;
    transition: all 0.18s ease;
    background: #ffffff;
  }
  .article-card:hover {
    border-color: var(--accent);
    box-shadow: 0 2px 12px rgba(37, 99, 235, 0.08);
    transform: translateY(-1px);
  }
  .article-num {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-soft);
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .article-card:hover .article-num {
    background: #eff6ff;
    color: var(--accent);
  }
  .article-title {
    font-size: 16px;
    font-weight: 500;
  }
  /* 页脚 */
  footer {
    margin-top: 72px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-secondary);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  footer a {
    color: var(--accent);
    text-decoration: none;
  }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="container">
    <header>
      <span class="site-badge">OSDWAN</span>
      <h1>OSDWAN 文章</h1>
      <p class="subtitle">欢迎访问 OSDWAN 文章页面。</p>
    </header>

    <main>
      <p class="section-title">文章目录</p>
      <ul class="article-list">
        <li>
          <a class="article-card" href="https://osdwan.github.io/sdwan/introduction.md">
            <span class="article-num">01</span>
            <span class="article-title">SD-WAN 基础介绍</span>
          </a>
        </li>
        <li>
          <a class="article-card" href="https://osdwan.github.io/sdwan/%E5%9B%BD%E9%99%85%E7%BD%91%E7%BB%9C%E6%9C%8D%E5%8A%A1%E5%95%86%E9%80%89%E5%9E%8B%E5%AF%B9%E6%AF%94.md">
            <span class="article-num">02</span>
            <span class="article-title">国际网络服务商选型对比</span>
          </a>
        </li>
        <li>
          <a class="article-card" href="https://osdwan.github.io/Claude.md">
            <span class="article-num">03</span>
            <span class="article-title">Claude 相关内容</span>
          </a>
        </li>
      </ul>
    </main>

    <footer>
      <span>© 2026 OSDWAN</span>
      <a href="https://github.com/osdwan/osdwan.github.io">GitHub 仓库</a>
    </footer>
  </div>
</body>
</html>
